# Model registry. Hardware-independent facts only; which model runs where,
# and with what context length, is set in configs/profiles/*.yaml.
# Ollama tags were verified against registry.ollama.ai on 2026-10-28.

llm:
  qwen3.5-4b:
    backend: ollama
    tag: "qwen3.5:4b-q4_K_M"        # identical digest to qwen3.5:4b
    quantization: Q4_K_M
    weights_gb: 2.65                 # registry layer size (+0.68 GB vision projector)
    thinking: toggle                 # think=true / think=false
    cost_per_1m_input_usd: 0.0
    cost_per_1m_output_usd: 0.0
  qwen3.5-9b:
    backend: ollama
    tag: "qwen3.5:9b-q4_K_M"         # identical digest to qwen3.5:9b
    quantization: Q4_K_M
    weights_gb: 5.63                 # registry layer size (+0.92 GB vision projector)
    thinking: toggle
    cost_per_1m_input_usd: 0.0
    cost_per_1m_output_usd: 0.0
  gpt-oss-20b:                       # lab profile only
    backend: ollama
    tag: "gpt-oss:20b"
    quantization: MXFP4              # unverified: as published by Ollama
    weights_gb: 13.79                # registry layer size
    thinking: levels                 # think="low" | "medium" | "high"
    cost_per_1m_input_usd: 0.0
    cost_per_1m_output_usd: 0.0
  # Fallbacks (tags exist; not pulled unless we switch, see README)
  qwen3-4b:
    backend: ollama
    tag: "qwen3:4b-q4_K_M"
    quantization: Q4_K_M
    thinking: toggle
    cost_per_1m_input_usd: 0.0
    cost_per_1m_output_usd: 0.0
  deepseek-r1-7b:
    backend: ollama
    tag: "deepseek-r1:7b"            # DeepSeek-R1-Distill-Qwen-7B
    quantization: Q4_K_M             # unverified
    thinking: always
    cost_per_1m_input_usd: 0.0
    cost_per_1m_output_usd: 0.0

  # Optional hosted API arm (OpenAI-compatible). Keys from .env only.
  # PRICES: VERIFY BEFORE REPORTING. Model names and prices are placeholders
  # until checked against the provider's pricing page on the day of the run.
  api-deepseek:
    backend: api
    base_url: "https://api.deepseek.com"
    model: "deepseek-reasoner"       # unverified: check provider docs
    api_key_env: DEEPSEEK_API_KEY
    cost_per_1m_input_usd: null      # verify before reporting
    cost_per_1m_output_usd: null     # verify before reporting
  api-gemini:
    backend: api
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model: "gemini-2.5-flash"        # unverified: check provider docs
    api_key_env: GEMINI_API_KEY
    cost_per_1m_input_usd: null      # verify before reporting
    cost_per_1m_output_usd: null     # verify before reporting

embedders:
  qwen3-embedding-0.6b:
    hf_id: "Qwen/Qwen3-Embedding-0.6B"
    query_prompt_name: query         # instruction prompt for queries
  bge-small-en-v1.5:                 # fallback if CPU indexing is too slow
    hf_id: "BAAI/bge-small-en-v1.5"
    query_prompt_name: null

rerankers:
  bge-reranker-v2-m3:
    hf_id: "BAAI/bge-reranker-v2-m3"
  ms-marco-minilm-l6-v2:             # fallback if too slow on CPU
    hf_id: "cross-encoder/ms-marco-MiniLM-L6-v2"
