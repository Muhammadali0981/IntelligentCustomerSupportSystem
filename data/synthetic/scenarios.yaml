# Ticket scenarios for the fictional company Quillfen Electronics.
# This file is the source of truth for every gold label. scripts/generate_synthetic.py
# asks the LLM only to write customer-style ticket text for each scenario; labels
# (category, known/new, matched issue, relevant chunks, reference answer, escalation)
# come from here, never from the LLM.
#
# Chunk IDs are "<doc_id>#<section-slug>", slug = lowercased heading, non-alphanumerics -> "-".
# The generator validates that every chunk ID exists in data/synthetic/kb/.

# ---------------------------------------------------------------------------
# Known issues: links to related KB docs, two ticket contexts each (a, b),
# and one reference answer. Relevant chunks default to the bulletin's
# #symptoms and #resolution sections plus `extra_chunks`.
# ---------------------------------------------------------------------------
known_issues:
  KI-001:
    doc: ki-001-aria-buds-left-disconnect
    related_docs: [ts-aria-buds]
    contexts:
      - "Left Aria Buds earbud keeps cutting out every few minutes since an update the app installed last week; right one fine. Customer already tried re-pairing."
      - "Customer uses Aria Buds for work calls; during calls the left side drops and audio jumps to the right bud. Mentions firmware 3.2.1 is shown in the app. Asks if the buds are defective and wants a replacement."
    reference_answer: "This is a known issue with Aria Buds firmware 3.2.1, which causes the left earbud to drop out. It is fixed in firmware 3.2.4: open the QuillCloud app > Devices > Aria Buds > Firmware and update with both buds in the open case. Then reset the buds (hold the case button for 15 seconds until the light flashes amber three times) and pair them again. The buds are not defective, so a replacement is not needed."
  KI-002:
    doc: ki-002-nimbus14-sleep-drain
    related_docs: [ts-nimbus14-battery]
    extra_chunks: [ts-nimbus14-battery#updating-the-bios]
    contexts:
      - "Nimbus 14 laptop loses about a third of its battery overnight with the lid closed; battery is fine during the day."
      - "Customer's Nimbus 14 is warm when taken out of the backpack in the morning and the battery dropped a lot while 'sleeping'. Worried the battery is damaged and wants a warranty repair."
    reference_answer: "This is a known issue with Nimbus 14 BIOS version 1.08, which stops the laptop from entering its deepest sleep state. Update the BIOS to version 1.10 in Quillfen Update Utility > BIOS, with the charger connected and the lid open. Until you update, use Hibernate instead of Sleep. Your battery health is not affected, so no warranty claim is needed."
  KI-003:
    doc: ki-003-hearth-hub-wpa3
    related_docs: [ts-hearth-hub-connectivity]
    contexts:
      - "Hearth Hub went offline (orange light pulsing) after the internet provider installed a new router; setting it up again fails at the Wi-Fi step."
      - "Hearth Hub stopped working after the router updated itself overnight; customer noticed the router security now says WPA3. Smart lights no longer respond to the hub."
    reference_answer: "This is a known issue: Hearth Hub firmware before 5.1 does not support WPA3-only Wi-Fi security, which new or updated routers often use. In your router settings, set Wi-Fi security to WPA2/WPA3 mixed (also called WPA3 transition mode). The hub will then reconnect and update itself to firmware 5.1, after which WPA3-only also works."
  KI-004:
    doc: ki-004-lumen-cam-flicker
    related_docs: [ts-lumen-cam]
    extra_chunks: [ts-lumen-cam#night-vision-and-image-flicker]
    region: [UK, EU]
    contexts:
      - "Customer in the UK: Lumen Cam indoor video shows rolling dark bands in the evening under lamps since the camera updated; daytime outdoor video is fine."
      - "Customer in Germany: Lumen Cam picture flickers badly indoors after an automatic update; they think the camera is broken and want to return it."
    reference_answer: "This is a known issue: firmware 2.4 reset the camera's Anti-flicker setting to 60 Hz, but mains power in the UK and EU is 50 Hz, which causes the flicker. In the QuillCloud app go to Lumen Cam > Video and set Anti-flicker to 50 Hz. The setting is kept after future updates, and the camera is not faulty."
  KI-005:
    doc: ki-005-duplicate-pending-charges
    related_docs: [faq-payments]
    extra_chunks: [faq-payments#pending-charges-and-authorisations]
    contexts:
      - "Customer sees two identical pending charges for one order in their banking app after checkout first showed an error and they tried again. Only one order in their account."
      - "Customer is worried they were charged three times for a Nimbus 14 order; their bank shows three pending payments of the same amount. They want the extra money back immediately."
    reference_answer: "Only one charge is taken for your order. Each checkout attempt places a temporary authorisation, and your bank shows these as pending even when the attempt failed. The extra pending authorisations disappear automatically within 3-7 business days, depending on your bank; we cannot release them earlier. If an extra amount still shows as a completed charge (not pending) after 7 business days, contact us with the order number and the billing team will look into it."
  KI-006:
    doc: ki-006-promo-code-plus-members
    related_docs: [pol-promo-codes, pol-plus-membership]
    extra_chunks: [pol-promo-codes#codes-and-quillfen-plus]
    contexts:
      - "Quillfen Plus member gets 'This code is not valid' for a promo code from an email that has not expired, ordering an Aria Max."
      - "Plus member is annoyed that a 5% promo code is rejected at checkout for Nimbus 14; thinks Plus members are being excluded from deals."
    reference_answer: "Your code is valid, but promo codes do not combine with the 5% Plus member price, and checkout applies whichever discount is larger. Because of a known issue, checkout currently shows 'This code is not valid' instead of 'Better discount applied'. The member price is already in your order total. If your promo code would have given a bigger discount than the member price, place the order and contact us; we will refund the difference."
  KI-007:
    doc: ki-007-invoice-blank-safari
    related_docs: [faq-invoices]
    contexts:
      - "Customer on a Mac clicks Invoice on their order page and gets a blank white page."
      - "Small business owner needs the invoice for their accountant; on their iPad the invoice PDF is empty."
    reference_answer: "This is a known issue: the invoice viewer does not work with Safari's built-in PDF preview, so the invoice opens blank. Choose 'Email invoice' on the order page to get the PDF by email, or open the order page in another browser such as Chrome, Firefox or Edge. The invoice itself is correct."
  KI-008:
    doc: ki-008-reset-email-outlook-delay
    related_docs: [ts-password-reset]
    contexts:
      - "Customer with a hotmail.com address requested a password reset several times and no email arrives."
      - "Customer with an outlook.com address got the reset email over an hour later and the link said it had expired. Locked out and frustrated."
    reference_answer: "This is a known issue: Outlook, Hotmail and Live addresses are currently receiving our emails with a delay of up to 90 minutes. Request one reset link only and then wait up to 90 minutes without requesting another, because each new request cancels the earlier link. Check your Junk folder and add noreply@quillfen.example to your safe senders. When the email arrives, use the link straight away. If you are still signed in to the QuillCloud app, you can also change your password there under Account > Security."
  KI-009:
    doc: ki-009-app-signout-loop
    related_docs: [ts-quillcloud-app, ts-login-problems]
    extra_chunks: [ts-quillcloud-app#clearing-the-app-cache]
    contexts:
      - "Since updating the QuillCloud app, it says 'Session expired' and signs the customer out every time they open it; the website works."
      - "Customer on Android keeps getting kicked out of the QuillCloud app after the latest update and wonders if their account was hacked and whether they should change their password."
    reference_answer: "This is a known issue in QuillCloud app version 4.0, which signs users out when refreshing the session. Your account is fine and you do not need to change your password. Update the app to version 4.0.2 or later; on Android, then clear the app cache (Settings > Apps > QuillCloud > Storage > Clear cache), and on iPhone delete and reinstall the app. Then sign in again."
  KI-010:
    doc: ki-010-sms-codes-uk
    related_docs: [ts-2fa]
    region: [UK]
    contexts:
      - "UK customer does not receive the SMS verification code when signing in; signal is fine."
      - "UK customer gets the SMS sign-in code only after it has already expired, several times in a row, and cannot sign in to check an order."
    reference_answer: "This is a known issue: since mid-October some UK mobile networks are not delivering our SMS codes on time. To sign in, use one of your backup codes or choose 'Send code by email instead' on the verification screen. After signing in, we recommend switching two-step verification to an authenticator app in Account > Security."
  KI-011:
    doc: ki-011-canada-label-created
    related_docs: [faq-delivery-tracking]
    region: [CA]
    contexts:
      - "Customer in Canada: tracking has said 'Label created' for 6 days, but the order page says Shipped."
      - "Customer in Toronto needs a gift by the weekend; NorthPost Express tracking has not moved past 'Label created' for a week and they want a replacement sent now."
    reference_answer: "This is a known issue: NorthPost Express is not scanning parcels at pick-up during a backlog, so tracking stays at 'Label created' even though the parcel is moving. Most parcels get a scan at the Canadian sorting centre and arrive within 10 business days of shipping. If there is still no update 15 business days after shipping, contact us and we will open a lost-parcel investigation; we cannot send a replacement before then."
  KI-012:
    doc: ki-012-eu-customs-fees-uk-warehouse
    related_docs: [pol-international-customs]
    extra_chunks: [pol-international-customs#if-you-were-charged-customs-fees]
    region: [EU]
    contexts:
      - "Customer in France ordered a Hearth Hub; the carrier wants import VAT and a clearance fee before delivering, and the parcel comes from the UK."
      - "Customer in Ireland already paid a 'customs clearance' charge to the courier for a Lumen Cam and thinks prices were supposed to include everything."
    reference_answer: "This is a known issue: some parcels from our temporary UK warehouse were sent without the duty-paid label. You should not have to pay these fees. Pay the fee to receive the parcel (or refuse it for a full refund of the order), keep the carrier's receipt, and submit a customs refund claim in Account > Orders > Get help > Customs fee within 60 days of delivery. We refund the full amount to your original payment method within 5 business days of approval."
  KI-013:
    doc: ki-013-address-unit-number-dropped
    related_docs: [faq-orders]
    contexts:
      - "Customer notices the order confirmation is missing their apartment number although they typed it when choosing the suggested address."
      - "Customer ordered 3 hours ago and the confirmation shows the street but no flat number; worried the parcel will not arrive. Order not shipped yet."
    reference_answer: "This is a known issue with the address suggestions at checkout, which can remove the apartment or unit number. If you ordered less than 1 hour ago, add it in Account > Orders > Edit order. After 1 hour, if the order has not shipped, we can add the unit number for the carrier as a delivery note; reply with the number. If it has already shipped, US customers can add it through the carrier redirect; elsewhere contact the carrier with your tracking number."
  KI-014:
    doc: ki-014-plus-shipping-after-renewal
    related_docs: [pol-plus-membership, pol-shipping-rates]
    contexts:
      - "Plus member was charged standard shipping on an order placed the day after their membership renewed."
      - "Customer renewed Quillfen Plus yesterday; checkout still adds a shipping fee to a small order and the membership page says Active."
    reference_answer: "This is a known issue: right after a renewal, checkout can keep your old membership status for up to 48 hours. Sign out and sign in again before checking out to refresh it. If you were already charged shipping, we will refund the shipping charge to your original payment method on request; you do not need to cancel the order."
  KI-015:
    doc: ki-015-nimbus14-monitor-driver
    related_docs: [ts-nimbus14-display]
    extra_chunks: [ts-nimbus14-display#connecting-an-external-monitor]
    contexts:
      - "External monitor connected to the Nimbus 14 shows 'No signal' since a driver update; it worked before. Laptop screen fine."
      - "Customer working from home: Nimbus 14 detects the monitor in display settings but the monitor stays black; tried another cable."
    reference_answer: "This is a known issue with graphics driver 31.0.15 on the Nimbus 14, which breaks video output over USB-C. Install driver 31.0.17 from Quillfen Update Utility > Drivers and restart. Make sure the monitor is connected to the left USB-C port, because the right port does not support video."
  KI-016:
    doc: ki-016-split-payment-refund-store-credit
    related_docs: [pol-refunds]
    extra_chunks: [pol-refunds#split-payments]
    contexts:
      - "Customer paid partly with a gift card and partly with a credit card; after returning the item the whole refund appeared as store credit."
      - "Customer used a gift card plus PayPal; refund shows only as store credit and they want their PayPal money back."
    reference_answer: "This is a known issue affecting refunds of orders paid with more than one method: the whole refund was added as store credit by mistake. As long as the store credit has not been spent, we can convert the card or PayPal share back to your original payment method; reply to confirm and we will do it. It then arrives in 5-10 business days for cards or 3-5 for PayPal. The gift card share stays as gift card balance."
  KI-017:
    doc: ki-017-aria-max-anc-button
    related_docs: [ts-aria-max]
    extra_chunks: [ts-aria-max#factory-reset]
    contexts:
      - "Aria Max ANC button does nothing after a firmware update; changing noise cancelling in the app still works."
      - "Customer thinks the noise cancelling button on their Aria Max is physically broken and wants a repair; other buttons work."
    reference_answer: "This is a known issue after the Aria Max firmware 2.0 update, which does not always migrate the button settings. Factory reset the headphones: with them on, hold the power and ANC buttons together for 15 seconds until the light flashes red and white, then pair them again. The ANC button will work normally afterwards, so no repair is needed."
  KI-018:
    doc: ki-018-hearth-hub-dst-offset
    related_docs: [ts-hearth-hub-automations]
    extra_chunks: [ts-hearth-hub-automations#time-zone-and-schedules]
    contexts:
      - "Since the clocks changed at the weekend, Hearth Hub turns the lights on an hour early; the time shown in the app is correct."
      - "Hearth Hub morning heating schedule runs an hour late since daylight saving ended; customer set the time zone manually during setup."
    reference_answer: "This is a known issue on Hearth Hub firmware 5.0.2 or earlier with a manually selected time zone: the hub does not apply the clock change. In the QuillCloud app go to Devices > Hearth Hub > Time zone and turn on 'Set automatically' (or select your time zone again). Your schedules will then run at the right time; firmware 5.0.3 fixes this permanently."
  KI-019:
    doc: ki-019-gift-card-balance-app
    related_docs: [pol-gift-cards, ts-quillcloud-app]
    extra_chunks: [pol-gift-cards#checking-your-balance]
    contexts:
      - "Gift card added to the account shows 0.00 in the QuillCloud app Wallet although it has never been used."
      - "Customer received a gift card for their birthday, added it, and the app says zero balance; worried the money was stolen."
    reference_answer: "This is a known display error in the QuillCloud app Wallet; your gift card balance has not changed. You can see the real balance on the website in Account > Wallet or at quillfen.example/giftcard, and you can use the gift card normally at checkout on the website or in the app."
  KI-020:
    doc: ki-020-confirmation-email-delay
    related_docs: [faq-orders]
    extra_chunks: [faq-orders#cancelling-an-order]
    contexts:
      - "Customer ordered during the Autumn Sale but never got a confirmation email and asks whether the order went through."
      - "Customer placed the same order twice during the sale because no confirmation email arrived, and now sees two orders."
    reference_answer: "Order confirmation emails are delayed because of the high volume during the Autumn Sale. If the order appears in Account > Orders, or you saw a confirmation screen with an order number, it has been placed and you do not need to order again. If you placed a duplicate order, you can cancel it free of charge in Account > Orders > Cancel order until it ships."

known_defaults:
  n: 10
  should_escalate: false

# ---------------------------------------------------------------------------
# New (and special) scenarios, fully specified.
# type: near_miss | novel | novel_escalate | out_of_scope | injection
# ---------------------------------------------------------------------------
scenarios:
  # ---- near misses: same topic as a known issue, different root cause ----
  - id: NM-01
    type: near_miss
    near_issue: KI-001
    category: technical
    n: 5
    brief: "Left Aria Buds earbud does not charge: after a night in the case it is dead and the case light does not show anything when the left bud is put in. No firmware update recently; the problem is charging, not dropping out."
    relevant_chunk_ids: [ts-aria-buds#one-earbud-not-charging]
    should_escalate: false
    reference_answer: "Clean the metal contacts on the left earbud and inside the case with a dry cotton swab, and check that the ear tip is not stopping the bud from sitting flat in the case. If the case light still does not show amber when you insert the left bud, the bud or case may be faulty; start a warranty claim in Account > Orders > Get help > Warranty claim with the serial number."
  - id: NM-02
    type: near_miss
    near_issue: KI-002
    category: technical
    n: 5
    brief: "Nimbus 14 bought about 10 months ago (US) battery now lasts only 4-5 hours in normal use. BIOS already updated to 1.10. Sleep drain is normal. The Control Center battery health report shows 74%."
    relevant_chunk_ids: [ts-nimbus14-battery#checking-battery-health, pol-warranty#coverage-periods, pol-warranty#what-is-not-covered]
    should_escalate: false
    reference_answer: "A battery health of 74% after about 10 months is below the 80% limit, so it is covered by the warranty (1 year in the US). Start a warranty claim in Account > Orders > Get help > Warranty claim with the serial number. We will run remote checks first and then repair or replace the battery."
  - id: NM-03
    type: near_miss
    near_issue: KI-003
    category: technical
    n: 5
    brief: "Brand new Hearth Hub cannot be set up at all. Customer's mesh router only broadcasts a 5 GHz network (they turned off 2.4 GHz to 'speed things up'). Security is WPA2."
    relevant_chunk_ids: [ts-hearth-hub-connectivity#network-requirements]
    should_escalate: false
    reference_answer: "The Hearth Hub can only connect to 2.4 GHz Wi-Fi; it does not support 5 GHz. Turn the 2.4 GHz band back on in your router settings (it can share the same network name as 5 GHz), then set up the hub again. Your WPA2 security setting is fine."
  - id: NM-04
    type: near_miss
    near_issue: KI-005
    category: billing
    n: 5
    brief: "Customer cancelled an order two days ago before it shipped, and the charge is still on their credit card statement as a completed charge (not pending). Wants to know where the money is."
    relevant_chunk_ids: [pol-refunds#when-refunds-are-issued, pol-refunds#how-long-refunds-take-to-arrive]
    should_escalate: false
    reference_answer: "For orders cancelled before shipping, the refund is issued immediately when you cancel. Card refunds then take 5-10 business days to appear, depending on your bank. If it has not appeared after 10 business days, contact us and we will give you the refund reference number (ARN) so your bank can trace it."
  - id: NM-05
    type: near_miss
    near_issue: KI-008
    category: account_access
    n: 5
    brief: "Gmail user requested the password reset three times quickly; all three emails arrived within a minute, but clicking the first one says the link is invalid."
    relevant_chunk_ids: [ts-password-reset#requesting-a-reset-link, ts-password-reset#reset-email-not-received]
    should_escalate: false
    reference_answer: "Only the most recent reset link works: each new request makes the earlier links invalid. Open the newest of the three emails and use that link within 60 minutes. If it has expired, request one more link and use it as soon as it arrives."
  - id: NM-06
    type: near_miss
    near_issue: KI-011
    category: shipping
    n: 5
    brief: "Customer in the US: tracking has shown 'Label created' for 3 days. Order shipped Monday. Asks if the parcel is lost."
    relevant_chunk_ids: [faq-delivery-tracking#tracking-your-order, faq-delivery-tracking#late-or-lost-parcels]
    should_escalate: false
    reference_answer: "'Label created' means the carrier has not scanned the parcel yet; it usually updates within 24-48 hours, but a few days without a scan is not unusual. A parcel is only treated as possibly lost if tracking has not changed for 10 business days. If there is still no update by then, open Account > Orders > Get help > Parcel not arrived and we will investigate and send a replacement or refund."
  - id: NM-07
    type: near_miss
    near_issue: KI-012
    category: shipping
    n: 5
    brief: "Customer in Canada was asked by the courier to pay duties and a brokerage fee for an Aria Max order from the Canadian store. They paid it and have the receipt."
    relevant_chunk_ids: [pol-international-customs#prices-include-duties, pol-international-customs#if-you-were-charged-customs-fees]
    should_escalate: false
    reference_answer: "Prices in the Canadian store include duties and taxes, so you should not have been charged. Keep the courier's receipt and submit a customs refund claim in Account > Orders > Get help > Customs fee within 60 days of delivery. We refund the full amount to your original payment method within 5 business days of approval."
  - id: NM-08
    type: near_miss
    near_issue: KI-017
    category: technical
    n: 5
    brief: "Aria Max noise cancelling seems weak: customer can still hear a lot on the train. The ANC button works and switches modes. Customer wears glasses."
    relevant_chunk_ids: [ts-aria-max#noise-cancelling-modes]
    should_escalate: false
    reference_answer: "Noise cancelling depends on a good seal around your ears. Check that the ear cushions are seated correctly and that the mode is set to Noise cancelling (not Transparency) with the ANC button or in the QuillCloud app. Glasses frames can break the seal, so try adjusting the headband position. If it is still weak with a good seal, contact us for further checks."
  - id: NM-09
    type: near_miss
    near_issue: KI-018
    category: technical
    n: 5
    brief: "Hearth Hub automation 'turn on hallway light when door opens' stopped working. Timing is not the problem; it just never triggers. The door sensor shows 'Not connected' in the app. Hub light is solid white."
    relevant_chunk_ids: [ts-hearth-hub-automations#automations-do-not-run, ts-hearth-hub-automations#devices-not-responding-to-the-hub]
    should_escalate: false
    reference_answer: "Your hub is online, but the automation cannot run because the door sensor is not connected. Replace the sensor's battery, move it closer to the hub if possible, and if it still shows 'Not connected', remove and re-add it in the app. Once every device in the automation shows 'Connected', the automation will run again."
  - id: NM-10
    type: near_miss
    near_issue: KI-006
    category: billing
    n: 5
    brief: "Customer who is NOT a Plus member tries to use a 10% newsletter welcome code to buy a gift card and gets an error. Code was received last week."
    relevant_chunk_ids: [pol-promo-codes#rules-for-promo-codes, pol-promo-codes#newsletter-welcome-code]
    should_escalate: false
    reference_answer: "Promo codes, including the newsletter welcome code, cannot be used to buy gift cards. The welcome code is valid for 30 days on Quillfen-brand products for your first order, so you can still use it on an eligible product."

  # ---- novel issues that need reasoning over several policy chunks ----
  - id: NV-01
    type: novel
    category: billing
    n: 5
    brief: "Customer in Germany (EU), not a Plus member, received a Nimbus 14 laptop 10 days ago, opened and used it, changed their mind. Asks how much they will get back and whether there is a restocking fee."
    relevant_chunk_ids: [pol-returns#eu-and-uk-right-of-withdrawal, pol-returns#return-shipping-and-restocking-fees]
    should_escalate: false
    reference_answer: "You can return it: in the EU you have a 14-day right of withdrawal from delivery, even for opened items, and no restocking fee applies within those 14 days. Because this is a change-of-mind return and you are not a Plus member, the €4.99 return label fee is deducted, so you get the item price back minus €4.99. Start the return in Account > Orders > Return item."
  - id: NV-02
    type: novel
    category: billing
    n: 5
    brief: "Customer in the US, not a Plus member, opened a Nimbus 14 and wants to return it for change of mind 20 days after delivery. It works fine. Asks what will be deducted."
    relevant_chunk_ids: [pol-returns#standard-return-window, pol-returns#return-shipping-and-restocking-fees]
    should_escalate: false
    reference_answer: "You are within the 30-day return window, so the return is accepted. Because the laptop was opened and is returned for change of mind more than 14 days after delivery, a 15% restocking fee applies, and the $5.99 return label fee is also deducted. You will get the price minus 15% and minus $5.99."
  - id: NV-03
    type: novel
    category: other
    n: 5
    brief: "Customer in the UK received Aria Buds 5 days ago, tried them on (so the ear tip seal is broken), they work fine but do not fit well. Wants to use their 14-day right to return."
    relevant_chunk_ids: [pol-returns#items-that-cannot-be-returned, pol-returns#eu-and-uk-right-of-withdrawal]
    should_escalate: false
    reference_answer: "Unfortunately Aria Buds cannot be returned once the hygiene seal on the ear tips is broken, unless they are faulty. This exception also applies during the UK 14-day withdrawal period. Since they work correctly, they cannot be returned for fit. If you notice a fault, you can make a warranty claim."
  - id: NV-04
    type: novel
    category: other
    n: 5
    brief: "Customer in the US, not a Plus member, got Aria Max headphones delivered on 20 November and wants to return them on 10 January because they were an unwanted gift. Thinks it is too late because 30 days have passed."
    relevant_chunk_ids: [pol-returns#holiday-returns, pol-returns#standard-return-window]
    should_escalate: false
    reference_answer: "It is not too late. Items delivered between 15 November and 31 December can be returned until 31 January, so you can still return the headphones. Start the return in Account > Orders > Return item; as a change-of-mind return, the $5.99 label fee is deducted from the refund."
  - id: NV-05
    type: novel
    category: shipping
    n: 5
    brief: "US customer, not a Plus member, was charged $6.99 shipping on a $60 order. They quote the shipping FAQ that says shipping is free on orders over $50 and want the shipping refunded. Order placed in October 2026."
    relevant_chunk_ids: [pol-shipping-rates#free-shipping-thresholds, faq-shipping-legacy#is-shipping-free]
    should_escalate: false
    reference_answer: "The FAQ you found is from 2025 and has been replaced. Since 1 September 2026, standard shipping in the US is free for orders of $75 or more; below that it costs $6.99. Your $60 order was therefore charged correctly. Quillfen Plus members get free standard shipping with no minimum."
  - id: NV-06
    type: novel
    category: billing
    n: 5
    brief: "Customer in Canada on the annual Quillfen Plus plan (CA$129) since 5 months ago. Complains they cannot find QuillCloud backup, and asks whether they can cancel and get money back. They used free shipping on two orders."
    relevant_chunk_ids: [pol-plus-membership#regional-limits, pol-plus-cancellation#annual-plans]
    should_escalate: false
    reference_answer: "QuillCloud backup is not available in Canada until 2027 because of data residency requirements; the other Plus benefits apply. In Canada you can cancel an annual plan at any time and get a prorated refund for the unused full months, minus the value of the benefits you used. Your two free shipments are valued at the standard shipping price. Cancel in Account > Membership > Cancel."
  - id: NV-07
    type: novel
    category: billing
    n: 5
    brief: "UK customer on the annual Plus plan (£89) renewed 10 days ago. Since the renewal they used free standard shipping once on a £30 order. Wants to cancel and asks how much they get back."
    relevant_chunk_ids: [pol-plus-cancellation#annual-plans, pol-shipping-rates#free-shipping-thresholds]
    should_escalate: false
    reference_answer: "Because you are within 14 days of the renewal but have used a Plus benefit, you get a refund minus the value of what you used. The free shipping on your £30 order is valued at the standard UK shipping price of £4.99, so the refund is £89 - £4.99 = £84.01. Cancel in Account > Membership > Cancel."
  - id: NV-08
    type: novel
    category: billing
    n: 5
    brief: "Customer bought Aria Max 10 days ago and now sees it cheaper in a competitor's 'lightning deal' that ends tonight. Wants a price match. Quillfen's own price has not changed."
    relevant_chunk_ids: [pol-price-match#matching-a-competitor-s-price, pol-price-match#when-our-own-price-drops]
    should_escalate: false
    reference_answer: "Unfortunately we cannot match this price, because flash or lightning deals are excluded from our price match policy. If the Quillfen price of the Aria Max drops within 14 days of your purchase (30 days for Plus members), you can request the difference."
  - id: NV-09
    type: novel
    category: technical
    n: 5
    brief: "US customer bought a Nimbus 14 18 months ago while a Quillfen Plus member. Battery health report now shows 76%. Asks if it is still under warranty."
    relevant_chunk_ids: [pol-warranty#coverage-periods, pol-warranty#what-is-not-covered, ts-nimbus14-battery#checking-battery-health]
    should_escalate: false
    reference_answer: "Yes. In the US the warranty is 1 year, and Plus members get one extra year for products bought while the membership was active, so your laptop is covered for 2 years. A battery below 80% capacity within the warranty is a covered defect. Start a warranty claim with the serial number; as a Plus member you also get advance replacement."
  - id: NV-10
    type: novel
    category: technical
    n: 5
    brief: "Customer in Spain (EU) has a Lumen Cam bought 20 months ago that no longer powers on with any cable or adapter. Not a Plus member. Assumes the warranty has expired after one year."
    relevant_chunk_ids: [pol-warranty#coverage-periods, pol-warranty#how-to-make-a-claim]
    should_escalate: false
    reference_answer: "In the EU, Quillfen-brand products have a 2-year legal guarantee from delivery, so your Lumen Cam is still covered at 20 months. Make a warranty claim in Account > Orders > Get help > Warranty claim with the serial number. After remote checks, we will repair or replace it."
  - id: NV-11
    type: novel
    category: billing
    n: 5
    brief: "US customer, not a Plus member, paid $200 for an item using a $50 gift card plus $150 on Visa. Returning it for change of mind within 30 days. Wants the full refund to the Visa card as cash."
    relevant_chunk_ids: [pol-refunds#split-payments, pol-returns#return-shipping-and-restocking-fees]
    should_escalate: false
    reference_answer: "Refunds for split payments are made in the same proportion as the payment: the gift card share goes back to the gift card and the rest to your Visa card. Gift card amounts cannot be refunded as cash. Because this is a change-of-mind return, the $5.99 return label fee is deducted from the refund."
  - id: NV-12
    type: novel
    category: other
    n: 5
    brief: "Customer moved from the UK to the US. Wants to sign in to the US store with their UK account, use a UK gift card there, and have an order shipped to their new US address."
    relevant_chunk_ids: [ts-login-problems#account-belongs-to-another-regional-store, pol-gift-cards#using-gift-cards, pol-shipping-rates#where-we-ship-from]
    should_escalate: false
    reference_answer: "Accounts are per regional store, so you need to create a new account on the US store to order there. Gift cards can only be used on the store where they were bought, so your UK gift card works only in the UK store. Each regional store ships only within its own region, so US deliveries must be ordered from the US store."

  # ---- new issues that must go to a human ----
  - id: NE-01
    type: novel_escalate
    category: account_access
    n: 4
    brief: "EU customer formally requests a copy of all personal data Quillfen holds about them under GDPR, and wants it sent by email today."
    relevant_chunk_ids: [pol-privacy-data-requests#who-handles-them, pol-privacy-data-requests#timelines-and-identity-checks]
    should_escalate: true
    reference_answer: "Personal data requests are handled by the Quillfen Privacy Team, not by general support. I have passed your request on; the Privacy Team will first confirm your identity and then complete the request within 30 days. You will be contacted by email. You can also write to privacy@quillfen.example."
  - id: NE-02
    type: novel_escalate
    category: account_access
    n: 4
    brief: "Customer sees two orders they did not place and their account email was changed to an address they do not recognise; they can still sign in with an old session in the app."
    relevant_chunk_ids: [pol-account-security#suspicious-activity]
    should_escalate: true
    reference_answer: "This looks like someone else may have accessed your account. Please reset your password straight away. I am passing your case to the Security Team, who will lock the account, review the orders and email change, and contact you."
  - id: NE-03
    type: novel_escalate
    category: technical
    n: 4
    brief: "Nimbus 14 laptop case is bulging near the trackpad, the trackpad is lifting, and there is a slight chemical smell when charging."
    relevant_chunk_ids: []
    should_escalate: true
    reference_answer: "Please stop using and charging the laptop now, unplug it, and keep it away from anything flammable; a swollen battery can be a safety risk. I am passing this to a specialist agent who will contact you about a safe return and replacement."
  - id: NE-04
    type: novel_escalate
    category: billing
    n: 4
    brief: "Customer's refund was issued 25 business days ago and has not arrived on their card. They say they will file a chargeback with their bank and contact a lawyer if it is not fixed today."
    relevant_chunk_ids: [pol-refunds#how-long-refunds-take-to-arrive]
    should_escalate: true
    reference_answer: "I'm sorry the refund has not arrived. Card refunds normally appear within 10 business days, so this needs investigation. I am passing your case to the billing team, who will provide the refund reference number (ARN) your bank can use to trace it and will contact you."
  - id: NE-05
    type: novel_escalate
    category: account_access
    n: 4
    brief: "Customer lost their phone with the authenticator app, has no backup codes, and needs two-step verification turned off immediately to download an invoice for a deadline today."
    relevant_chunk_ids: [ts-2fa#lost-phone-or-no-access-to-codes]
    should_escalate: true
    reference_answer: "Without backup codes, two-step verification can only be turned off after an identity check by our support team. This takes 2-3 business days and cannot be skipped, for your account's security. I am passing your request to an agent who will start the identity check."

